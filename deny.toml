[graph]
all-features = true
exclude-dev = true

# This should be worked out, but shouldn't block updates
[bans]
multiple-versions = "deny"
skip = [
    { name = "syn" },
]

# Acked security advisories, non critical but should be addressed
[advisories]
ignore = [
    "RUSTSEC-2025-0056", # unmaintained: adler; should switch to adler2
]

# Not exhaustive, just whitelist the current dependency tree
[licenses]
allow = ["Apache-2.0", "MIT", "Unicode-3.0"]
